name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Headless smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke
        working-directory: desktop
        env:
          # GitHub runners restrict unprivileged user namespaces, which breaks
          # Electron's SUID sandbox helper. Safe to disable for our own smoke.
          ELECTRON_DISABLE_SANDBOX: "1"
      - name: Build installers
        run: npx electron-builder --publish never
        working-directory: desktop
        env:
          # Unsigned builds until signing certificates are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Collect release files
        shell: bash
        run: |
          mkdir -p upload
          find desktop/dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -exec cp {} upload/ \;
          ls -la upload
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: upload/*
          if-no-files-found: error

  publish-release:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update the release with all installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la assets
          if ! gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber assets/*
