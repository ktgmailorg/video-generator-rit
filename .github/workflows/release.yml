name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # electron-builder can only upload into an existing DRAFT release, so the
  # flow is: create one draft, let all OS jobs upload into it, then publish.
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create a draft release if none exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          if [ -z "$existing" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
              -f name="$GITHUB_REF_NAME" -F draft=true -F generate_release_notes=true >/dev/null
          fi
  desktop:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Headless smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke
        working-directory: desktop
      - name: Build installers
        run: npx electron-builder --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds until signing certificates are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  publish-release:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false >/dev/null
