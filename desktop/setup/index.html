<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
    <title>RIT Video Studio setup</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #14161a; --muted: #5c6470; --line: #dfe3e9;
        --card: #f6f7f9; --accent: #f76902; --accent-fg: #ffffff;
        --ok: #0f7b3f; --err: #b3261e; --local: #0b6fb8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181c; --fg: #f2f3f5; --muted: #a2abb8; --line: #2c3038;
          --card: #1e2126; --ok: #4ac57e; --err: #ff8a80; --local: #6cb6ff;
        }
      }
      * { box-sizing: border-box; }
      /* `display: flex` below would otherwise defeat the hidden attribute. */
      [hidden] { display: none !important; }
      body {
        margin: 0; padding: 32px 36px 40px; background: var(--bg); color: var(--fg);
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.01em; }
      p.lede { margin: 0 0 24px; color: var(--muted); max-width: 64ch; }
      .choices { display: grid; gap: 12px; }
      .choice {
        border: 1.5px solid var(--line); border-radius: 12px; padding: 15px 17px;
        background: var(--card); cursor: pointer; display: block;
      }
      .choice:hover { border-color: var(--muted); }
      .choice:has(input:checked) { border-color: var(--accent); }
      .choice-head { display: flex; align-items: center; gap: 10px; font-weight: 640; }
      .choice p { margin: 7px 0 0 26px; color: var(--muted); font-size: 13.5px; }
      .badge {
        margin-left: auto; font-size: 11px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.06em; color: var(--muted);
      }
      .badge.found { color: var(--ok); }
      .panel { margin: 20px 0 0; }
      .panel > h2 {
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em;
        color: var(--muted); margin: 22px 0 10px;
      }
      .provider {
        border: 1.5px solid var(--line); border-radius: 11px;
        padding: 13px 15px; margin-bottom: 10px; background: var(--card);
      }
      .provider-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
      .provider-head strong { font-size: 14.5px; }
      .tag {
        font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
        text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
        border: 1px solid var(--line); color: var(--muted);
      }
      .tag.local { color: var(--local); border-color: currentColor; }
      .tag.running { color: var(--ok); border-color: currentColor; }
      .provider .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
      input, select {
        flex: 1 1 240px; min-width: 0; padding: 8px 10px; border-radius: 8px;
        border: 1.5px solid var(--line); background: var(--bg); color: var(--fg);
        font: inherit; font-size: 13.5px;
      }
      button {
        font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 14px;
        border-radius: 8px; cursor: pointer; border: 1.5px solid var(--line);
        background: var(--bg); color: var(--fg); flex: 0 0 auto;
      }
      button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
      button:disabled { opacity: 0.55; cursor: progress; }
      .status { font-size: 13px; margin: 8px 0 0; }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--err); }
      .saved { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 8px; font-size: 13.5px; }
      code {
        background: var(--bg); padding: 2px 6px; border-radius: 6px;
        border: 1px solid var(--line); font-size: 12.5px;
      }
      footer {
        margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line);
        display: flex; align-items: center; gap: 14px;
      }
      footer .note { color: var(--muted); font-size: 13px; max-width: 50ch; }
      footer button { margin-left: auto; }
      a { color: var(--accent); }
      .warn {
        margin: 0 0 18px; padding: 10px 13px; border-radius: 9px; background: var(--card);
        border: 1px solid var(--line); color: var(--muted); font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to RIT Video Studio</h1>
    <p class="lede">
      Pick how the studio should write drafts. Visuals, captions, and
      rendering always run on this computer; the free narration voice uses
      Microsoft's Edge text-to-speech service, so the words to be spoken are
      sent there to be synthesized.
    </p>

    <p class="warn" id="storage-warning" hidden></p>

    <div class="choices">
      <label class="choice">
        <span class="choice-head">
          <input type="radio" name="mode" value="free" checked>
          Just my own script
          <span class="badge">No setup</span>
        </span>
        <p>
          Paste a script you already have. Nothing else to configure — no
          account, no key, no model to install.
        </p>
      </label>
      <label class="choice">
        <span class="choice-head">
          <input type="radio" name="mode" value="local">
          A model on this computer
          <span class="badge" id="local-badge">Private</span>
        </span>
        <p>
          Use Ollama, LM Studio, or llama.cpp to draft transcripts. Nothing is
          sent to any company and there is nothing to pay.
        </p>
      </label>
      <label class="choice">
        <span class="choice-head">
          <input type="radio" name="mode" value="cloud">
          An AI provider I have a key for
          <span class="badge">Your account</span>
        </span>
        <p>
          Anthropic, OpenAI, Gemini, Groq, Mistral, DeepSeek, OpenRouter,
          Together — or any custom OpenAI-compatible endpoint. Usage is billed
          to your own account.
        </p>
      </label>
    </div>

    <div class="panel" id="panel"></div>

    <footer>
      <span class="note" id="footer-note"></span>
      <button class="primary" id="continue">Open the studio</button>
    </footer>

    <script>
      const api = window.studioSetup;
      const panel = document.getElementById("panel");
      const noteEl = document.getElementById("footer-note");
      const warnEl = document.getElementById("storage-warning");
      let state = null;

      const escape = (value) =>
        String(value).replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[character]);

      const providersOfKind = (kind) =>
        state.providers.filter((provider) => provider.kind === kind);
      const savedFor = (id) =>
        state.configured.find((entry) => entry.id === id);
      const discovered = (id) =>
        (state.discovered || []).find((entry) => entry.id === id);

      function savedMarkup(saved) {
        return `
          <div class="saved">
            <span>Model <code>${escape(saved.model)}</code></span>
            ${saved.hint ? `<span>· key <code>${escape(saved.hint)}</code></span>` : ""}
            <span class="tag ${saved.executionLocation === "local" ? "local" : ""}">${escape(saved.executionLocation)}</span>
            <button data-action="forget">Remove</button>
          </div>`;
      }

      function providerCard(provider) {
        const saved = savedFor(provider.id);
        const found = discovered(provider.id);
        const needsUrl = provider.kind === "custom";
        const takesKey = provider.kind === "cloud" || provider.kind === "custom";
        const tags = [
          provider.kind === "local" ? '<span class="tag local">on this computer</span>' : "",
          found?.running ? '<span class="tag running">running</span>' : "",
        ].join("");
        return `
          <div class="provider" data-provider="${escape(provider.id)}">
            <div class="provider-head">
              <strong>${escape(provider.label)}</strong>${tags}
            </div>
            ${provider.hint ? `<p class="hint">${escape(provider.hint)}</p>` : ""}
            ${saved ? savedMarkup(saved) : `
              ${needsUrl ? `
              <div class="row">
                <input type="text" data-role="baseUrl" placeholder="https://your-server.example/v1"
                  value="${escape(provider.baseUrl || "")}" spellcheck="false">
              </div>` : ""}
              <div class="row">
                ${takesKey ? `<input type="password" data-role="key" autocomplete="off" spellcheck="false"
                  placeholder="${provider.kind === "custom" ? "API key (leave empty if none)" : "Paste your API key"}">` : ""}
                <button data-action="check">${provider.kind === "local" ? "Find models" : "Check"}</button>
                ${provider.keyUrl ? `<a href="#" data-action="open-key">Get a key ↗</a>` : ""}
                ${provider.setupUrl ? `<a href="#" data-action="open-setup">Install ↗</a>` : ""}
              </div>
              <div class="row" data-role="model-row" hidden>
                <select data-role="model"></select>
                <button class="primary" data-action="save">Use this</button>
              </div>`}
            <p class="status" data-role="status"></p>
          </div>`;
      }

      function render() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        if (mode === "free") {
          panel.innerHTML = "";
        } else if (mode === "local") {
          panel.innerHTML =
            `<h2>Model servers on this computer</h2>` +
            providersOfKind("local").map(providerCard).join("");
        } else {
          panel.innerHTML =
            `<h2>Providers</h2>` +
            providersOfKind("cloud").map(providerCard).join("") +
            `<h2>Custom endpoint</h2>` +
            providersOfKind("custom").map(providerCard).join("");
        }
        const count = state.configured.length;
        noteEl.textContent = count
          ? `${count} model source${count > 1 ? "s" : ""} ready. Narration and rendering stay free.`
          : "You can add or change a model source later from this screen.";
        const running = (state.discovered || []).filter((entry) => entry.running);
        const badge = document.getElementById("local-badge");
        if (running.length > 0) {
          badge.textContent = `${running.length} found`;
          badge.classList.add("found");
        }
        if (!state.encryptionAvailable) {
          warnEl.hidden = false;
          warnEl.textContent =
            "This system has no available keyring, so an API key will be kept in memory for this session only and will need re-entering next launch. Local models and free mode are unaffected.";
        }
      }

      function setStatus(card, message, kind) {
        const status = card.querySelector('[data-role="status"]');
        status.textContent = message;
        status.className = `status ${kind || ""}`;
      }

      const readField = (card, role) =>
        card.querySelector(`[data-role="${role}"]`)?.value?.trim() || "";

      panel.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        event.preventDefault();
        const card = button.closest("[data-provider]");
        const id = card.dataset.provider;
        const provider = state.providers.find((entry) => entry.id === id);
        const action = button.dataset.action;

        if (action === "open-key" || action === "open-setup") {
          await api.openExternal(
            action === "open-key" ? provider.keyUrl : provider.setupUrl,
          );
          return;
        }
        if (action === "forget") {
          await api.forgetProvider(id);
          state = await api.getState();
          render();
          return;
        }
        if (action === "check") {
          button.disabled = true;
          setStatus(card, "Checking…");
          const result = await api.verifyProvider({
            id,
            key: readField(card, "key"),
            baseUrl: readField(card, "baseUrl"),
          });
          button.disabled = false;
          if (!result.ok) {
            setStatus(card, result.error, "err");
            return;
          }
          const select = card.querySelector('[data-role="model"]');
          select.innerHTML = result.models
            .map((model) => `<option value="${escape(model)}">${escape(model)}</option>`)
            .join("");
          card.querySelector('[data-role="model-row"]').hidden = false;
          setStatus(
            card,
            `Found ${result.models.length} model${result.models.length > 1 ? "s" : ""} · runs ${result.executionLocation === "local" ? "on this computer" : "on the provider's servers"}. Choose one.`,
            "ok",
          );
          return;
        }
        if (action === "save") {
          button.disabled = true;
          setStatus(card, "Saving…");
          const result = await api.saveProvider({
            id,
            key: readField(card, "key"),
            baseUrl: readField(card, "baseUrl"),
            model: card.querySelector('[data-role="model"]').value,
          });
          button.disabled = false;
          if (!result.ok) {
            setStatus(card, result.error, "err");
            return;
          }
          state = await api.getState();
          render();
        }
      });

      document.querySelectorAll('input[name="mode"]').forEach((input) => {
        input.addEventListener("change", render);
      });

      document.getElementById("continue").addEventListener("click", async (event) => {
        event.target.disabled = true;
        await api.finish();
      });

      (async () => {
        state = await api.getState();
        if (state.configured.length > 0) {
          const kind = state.configured[0].kind === "local" ? "local" : "cloud";
          document.querySelector(`input[value="${kind}"]`).checked = true;
        }
        render();
        // Probing the local servers is slower than first paint, so fold the
        // result in when it arrives.
        state.discovered = await api.discoverLocal();
        render();
      })();
    </script>
  </body>
</html>
